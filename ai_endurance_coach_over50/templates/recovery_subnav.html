{# recovery_section: sleep | body #}
<style>
  .rec-subnav {
    background: rgba(17, 17, 20, 0.92);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: var(--gr-nav-height, 44px);
    z-index: 99;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .rec-subnav-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .rec-subnav-inner::-webkit-scrollbar { display: none; }
  .rec-subnav a {
    flex-shrink: 0;
    padding: 12px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .rec-subnav a:hover { color: var(--text); }
  .rec-subnav a.active {
    color: #38bdf8;
    border-bottom-color: #38bdf8;
  }
</style>
<nav class="rec-subnav" aria-label="Recovery sections">
  <div class="rec-subnav-inner">
    <a href="/sleep" class="{% if recovery_section == 'sleep' %}active{% endif %}">Sleep</a>
    <a href="/body" class="{% if recovery_section == 'body' %}active{% endif %}">Body</a>
  </div>
</nav>
