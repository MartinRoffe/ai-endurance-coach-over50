{# nutrition_section: overview | fuelling | sunday | cut (meals/recipes pages reuse these) #}
<style>
  .nut-subnav {
    background: rgba(17, 17, 20, 0.92);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: var(--gr-nav-height, 44px);
    z-index: 99;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .nut-subnav-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: stretch;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .nut-subnav-inner::-webkit-scrollbar { display: none; }
  .nut-subnav a {
    flex-shrink: 0;
    padding: 12px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .nut-subnav a:hover { color: var(--text); }
  .nut-subnav a.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .nut-subnav-more {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin-left: 8px;
    padding-left: 12px;
    border-left: 1px solid var(--border);
  }
  .nut-subnav-more-label {
    display: flex;
    align-items: center;
    padding: 12px 8px 12px 0;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.7;
    flex-shrink: 0;
  }
  .nut-subnav-more a {
    padding: 12px 12px;
    font-size: 10px;
    opacity: 0.85;
  }
  .nut-subnav-more a.active {
    opacity: 1;
  }
  @media (max-width: 640px) {
    .nut-subnav-inner { padding: 0 14px; }
    .nut-subnav a { padding: 10px 12px; font-size: 10px; }
    .nut-subnav-more { margin-left: 4px; padding-left: 8px; }
    .nut-subnav-more a { padding: 10px 10px; font-size: 9px; }
    .nut-subnav-more-label { display: none; }
  }
</style>
<nav class="nut-subnav" aria-label="Nutrition sections">
  <div class="nut-subnav-inner">
    <a href="/nutrition" class="{% if nutrition_section == 'overview' %}active{% endif %}">Today</a>
    <a href="/nutrition/fuelling" class="{% if nutrition_section == 'fuelling' %}active{% endif %}">Ride Fuel</a>
    <a href="/nutrition/sunday" class="{% if nutrition_section in ('sunday', 'shopping', 'lidl_shopping') %}active{% endif %}">Sunday Cook + Shop</a>
    <a href="/nutrition/cut" class="{% if nutrition_section == 'cut' %}active{% endif %}">Cut</a>
  </div>
</nav>
