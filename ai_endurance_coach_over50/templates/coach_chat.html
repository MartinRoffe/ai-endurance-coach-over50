<!-- ── AI Coach Chat ──────────────────────────────────────────────── -->
<div class="card coach-chat-card" style="padding:20px 24px;margin-bottom:16px">
  <div class="coach-chat-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div>
      <p class="eyebrow" style="margin-bottom:2px">AI Coach</p>
      <p style="font-family:var(--font-m);font-size:11px;color:var(--muted)">Ask about your training load, sessions, or request plan adjustments</p>
    </div>
    <button onclick="clearChatHistory()" style="font-family:var(--font-m);font-size:11px;letter-spacing:0.1em;color:var(--muted);background:none;border:1px solid var(--border);padding:4px 10px;cursor:pointer;border-radius:2px">CLEAR</button>
  </div>

  <div id="chat-messages" style="min-height:100px;max-height:480px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;padding-right:2px">
    <p id="chat-empty" style="font-family:var(--font-m);font-size:12px;color:var(--muted);text-align:center;padding:32px 0">Ask your coach anything about your training...</p>
  </div>

  <div id="proposal-cards" style="display:none;flex-direction:column;gap:10px;margin-bottom:12px;-webkit-overflow-scrolling:touch"></div>

  <p id="voice-status" style="display:none;font-family:var(--font-m);font-size:11px;color:var(--muted);margin:0 0 8px;letter-spacing:0.04em"></p>

  <div class="coach-chat-input-row" style="display:flex;gap:8px;align-items:flex-end">
    <textarea id="coach-input" rows="1" placeholder="e.g. How is my training load looking this week?"
      style="flex:1;background:#111113;border:1px solid var(--border);color:var(--text);font-family:var(--font-m);font-size:13px;padding:10px 14px;outline:none;border-radius:2px;resize:none;overflow-y:hidden;line-height:1.5;min-height:40px;max-height:160px"
      onfocus="this.style.borderColor='rgba(99,102,241,0.5)'" onblur="this.style.borderColor='var(--border)'"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,160)+'px'"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendCoachMessage()}"></textarea>
    <button type="button" id="mic-btn" title="Hold to talk" aria-label="Hold to talk"
      style="display:none;font-family:var(--font-m);font-size:11px;letter-spacing:0.1em;background:none;color:var(--muted);border:1px solid var(--border);padding:0 10px;height:40px;cursor:pointer;border-radius:2px;flex-shrink:0;white-space:nowrap;touch-action:none;-webkit-user-select:none;user-select:none">MIC</button>
    <button type="button" id="tts-mute-btn" title="Mute coach speech" aria-label="Mute coach speech"
      style="display:none;font-family:var(--font-m);font-size:11px;letter-spacing:0.1em;background:none;color:var(--muted);border:1px solid var(--border);padding:0 10px;height:40px;cursor:pointer;border-radius:2px;flex-shrink:0;white-space:nowrap">SPEAK</button>
    <select id="tts-voice" title="Coach voice" aria-label="Coach voice"
      style="display:none;max-width:140px;height:40px;background:#111113;border:1px solid var(--border);color:var(--muted);font-family:var(--font-m);font-size:11px;padding:0 6px;border-radius:2px;flex-shrink:0;outline:none"></select>
    <button id="send-btn" onclick="sendCoachMessage()"
      style="font-family:var(--font-m);font-size:11px;letter-spacing:0.12em;background:var(--accent);color:var(--text);border:none;padding:10px 20px;cursor:pointer;border-radius:2px;white-space:nowrap;flex-shrink:0;height:40px">SEND</button>
  </div>
</div>

<script>
(function() {
  let _proposals = [];

  // ── Voice (Web Speech API) ─────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const _ttsSupported = typeof window.speechSynthesis !== 'undefined';
  let _recognition = null;
  let _voiceBaseText = '';
  let _autoSendOnStop = false;
  let _ttsMuted = localStorage.getItem('coach_tts_muted') === '1';

  const micBtn = document.getElementById('mic-btn');
  const muteBtn = document.getElementById('tts-mute-btn');
  const voiceStatus = document.getElementById('voice-status');

  function setVoiceStatus(msg) {
    if (!msg) {
      voiceStatus.style.display = 'none';
      voiceStatus.textContent = '';
      return;
    }
    voiceStatus.textContent = msg;
    voiceStatus.style.display = 'block';
  }

  function syncMuteUI() {
    if (!muteBtn || muteBtn.style.display === 'none') return;
    muteBtn.textContent = _ttsMuted ? 'MUTED' : 'SPEAK';
    muteBtn.title = _ttsMuted ? 'Unmute coach speech' : 'Mute coach speech';
    muteBtn.setAttribute('aria-label', muteBtn.title);
    muteBtn.style.color = _ttsMuted ? 'var(--muted)' : 'var(--text-dim)';
    muteBtn.style.borderColor = _ttsMuted ? 'var(--border)' : 'rgba(99,102,241,0.35)';
  }

  function stopTTS() {
    _audioGen += 1;
    _audioQueue = [];
    _pumping = false;
    if (_audioPlaying) {
      try {
        _audioPlaying.pause();
        _audioPlaying.removeAttribute('src');
        _audioPlaying.load();
      } catch (e) {}
      _audioPlaying = null;
    }
    if (_ttsSupported) window.speechSynthesis.cancel();
    if (_ttsResumeTimer) {
      clearInterval(_ttsResumeTimer);
      _ttsResumeTimer = null;
    }
  }

  // Stream speech as sentences arrive (don't wait for the full reply).
  let _ttsSpoken = 0;
  let _ttsFillerSaid = false;
  let _ttsResumeTimer = null;
  let _elEnabled = false;
  let _audioGen = 0;
  let _audioQueue = [];
  let _audioPlaying = null;
  let _pumping = false;
  let _lastElText = '';

  function ensureTTSAlive() {
    // Chrome sometimes pauses speechSynthesis mid-utterance; nudge it.
    if (_ttsResumeTimer || !_ttsSupported) return;
    _ttsResumeTimer = setInterval(function() {
      if (!_ttsSupported || !window.speechSynthesis.speaking) {
        clearInterval(_ttsResumeTimer);
        _ttsResumeTimer = null;
        return;
      }
      window.speechSynthesis.resume();
    }, 4000);
  }

  function speakBrowser(clean) {
    if (!_ttsSupported) return;
    const voice = selectedVoice();
    const utter = new SpeechSynthesisUtterance(clean);
    if (voice) utter.voice = voice;
    utter.rate = 1;
    utter.pitch = 1;
    window.speechSynthesis.speak(utter);
    ensureTTSAlive();
  }

  function playBlob(blob, gen) {
    return new Promise(function(resolve) {
      if (gen !== _audioGen) { resolve(); return; }
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      _audioPlaying = audio;
      const done = function() {
        if (_audioPlaying === audio) _audioPlaying = null;
        URL.revokeObjectURL(url);
        resolve();
      };
      audio.onended = done;
      audio.onerror = done;
      audio.play().catch(done);
    });
  }

  async function pumpAudioQueue() {
    if (_pumping) return;
    _pumping = true;
    while (_audioQueue.length) {
      const item = _audioQueue.shift();
      if (item.gen !== _audioGen) continue;
      try {
        const blob = await item.ready;
        if (item.gen !== _audioGen) continue;
        if (!blob) {
          speakBrowser(item.text);
          continue;
        }
        await playBlob(blob, item.gen);
      } catch (e) {
        if (item.gen === _audioGen) speakBrowser(item.text);
      }
    }
    _pumping = false;
  }

  function enqueueElevenLabs(clean) {
    const gen = _audioGen;
    const previous = _lastElText;
    _lastElText = clean;
    const ready = fetch('/coach-tts', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: clean, previous_text: previous}),
    }).then(function(res) {
      if (!res.ok) throw new Error('tts ' + res.status);
      return res.blob();
    }).catch(function() { return null; });
    _audioQueue.push({gen: gen, text: clean, ready: ready});
    pumpAudioQueue();
  }

  function enqueueSpeech(raw) {
    if (_ttsMuted || !raw) return;
    if (!_elEnabled && !_ttsSupported) return;
    const clean = forSpeech(raw);
    if (!clean) return;
    if (_elEnabled) enqueueElevenLabs(clean);
    else speakBrowser(clean);
  }

  /** Queue any newly completed sentences from the live reply; flush remainder when final. */
  function feedTTS(accumulated, final) {
    if (_ttsMuted || !accumulated) return;
    if (!_elEnabled && !_ttsSupported) return;
    const text = accumulated;
    let start = _ttsSpoken;

    while (start < text.length) {
      const slice = text.slice(start);
      let cut = -1;
      for (let i = 0; i < slice.length; i++) {
        const ch = slice[i];
        if (ch !== '.' && ch !== '!' && ch !== '?') continue;
        // Skip decimals / version-ish numbers (e.g. 3.5, v2.1)
        if (ch === '.' && /\d/.test(slice[i - 1] || '') && /\d/.test(slice[i + 1] || '')) continue;
        const after = slice[i + 1];
        if (after === undefined) {
          if (final) cut = i + 1;
          break;
        }
        if (/\s/.test(after)) {
          cut = i + 1;
          break;
        }
      }
      if (cut < 0) break;

      const sentence = slice.slice(0, cut).trim();
      let next = start + cut;
      while (next < text.length && /\s/.test(text[next])) next++;

      // Incomplete trailing fragment while still streaming — wait
      if (!final && next >= text.length && !/[.!?]$/.test(sentence)) break;

      if (sentence) enqueueSpeech(sentence);
      start = next;
      _ttsSpoken = start;
    }

    if (final) {
      const rest = text.slice(_ttsSpoken).trim();
      if (rest) enqueueSpeech(rest);
      _ttsSpoken = text.length;
    }
  }

  function resetTTSStream() {
    stopTTS();
    _ttsSpoken = 0;
    _ttsFillerSaid = false;
    _lastElText = '';
  }

  // Default = browser voice. User picks from the dropdown (saved in localStorage).
  const voiceSelect = document.getElementById('tts-voice');
  let _coachVoice = null;

  function selectedVoice() {
    if (!_ttsSupported) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    const saved = localStorage.getItem('coach_tts_voice') || '';
    if (saved) {
      const match = voices.find(function(v) { return v.voiceURI === saved || v.name === saved; });
      if (match) return match;
    }
    return null; // system default — usually better than our guesses
  }

  function populateVoiceSelect() {
    if (!_ttsSupported || !voiceSelect || _elEnabled) return;
    const voices = (window.speechSynthesis.getVoices() || []).filter(function(v) {
      return (v.lang || '').toLowerCase().startsWith('en');
    });
    if (!voices.length) return;
    const prev = localStorage.getItem('coach_tts_voice') || '';
    voiceSelect.innerHTML = '';
    const def = document.createElement('option');
    def.value = '';
    def.textContent = 'Default';
    voiceSelect.appendChild(def);
    voices.forEach(function(v) {
      const opt = document.createElement('option');
      opt.value = v.voiceURI || v.name;
      opt.textContent = v.name.replace(/^.*?Voice\s+/i, '').slice(0, 28);
      voiceSelect.appendChild(opt);
    });
    voiceSelect.value = prev;
    if (voiceSelect.value !== prev) voiceSelect.value = '';
    voiceSelect.style.display = '';
    _coachVoice = selectedVoice();
  }

  if (_ttsSupported) {
    populateVoiceSelect();
    window.speechSynthesis.addEventListener('voiceschanged', populateVoiceSelect);
    voiceSelect.addEventListener('change', function() {
      localStorage.setItem('coach_tts_voice', voiceSelect.value);
      _coachVoice = selectedVoice();
      // Preview so you can hear the pick immediately
      stopTTS();
      const sample = new SpeechSynthesisUtterance('How is your form looking this week?');
      if (_coachVoice) sample.voice = _coachVoice;
      sample.rate = 1;
      window.speechSynthesis.speak(sample);
    });
  }

  // Prefer ElevenLabs when configured; hide the browser voice picker.
  fetch('/coach-tts-status').then(function(r) { return r.json(); }).then(function(j) {
    _elEnabled = !!(j && j.enabled);
    if (_elEnabled) {
      if (voiceSelect) voiceSelect.style.display = 'none';
      if (muteBtn) {
        muteBtn.style.display = '';
        syncMuteUI();
      }
      setVoiceStatus('Natural voice (ElevenLabs)');
      setTimeout(function() { setVoiceStatus(''); }, 2500);
    }
  }).catch(function() {});

  /** Expand coaching shorthand into athlete-facing spoken English. */
  function forSpeech(text) {
    let s = String(text);
    s = s.replace(/\*\*(.+?)\*\*/g, '$1');
    s = s.replace(/`([^`]+)`/g, '$1');
    s = s.replace(/#{1,6}\s*/g, '');
    s = s.replace(/^\s*[-*•]\s+/gm, '');
    s = s.replace(/[🔍✓]/g, '');
    s = s.replace(/→/g, ' to ');
    s = s.replace(/\u00b1/g, ' plus or minus ');
    s = s.replace(/\u00d7/g, ' times ');

    // Spoken dates — do this before turning dashes into commas (ranges use –)
    const MONTHS = {
      jan: 'January', january: 'January',
      feb: 'February', february: 'February',
      mar: 'March', march: 'March',
      apr: 'April', april: 'April',
      may: 'May',
      jun: 'June', june: 'June',
      jul: 'July', july: 'July',
      aug: 'August', august: 'August',
      sep: 'September', sept: 'September', september: 'September',
      oct: 'October', october: 'October',
      nov: 'November', november: 'November',
      dec: 'December', december: 'December',
    };
    const DOWS = {
      mon: 'Monday', monday: 'Monday',
      tue: 'Tuesday', tues: 'Tuesday', tuesday: 'Tuesday',
      wed: 'Wednesday', wednesday: 'Wednesday',
      thu: 'Thursday', thur: 'Thursday', thurs: 'Thursday', thursday: 'Thursday',
      fri: 'Friday', friday: 'Friday',
      sat: 'Saturday', saturday: 'Saturday',
      sun: 'Sunday', sunday: 'Sunday',
    };
    const MONTH_FULL = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December',
    ];
    const ORD_WORDS = [
      '', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh',
      'eighth', 'ninth', 'tenth', 'eleventh', 'twelfth', 'thirteenth',
      'fourteenth', 'fifteenth', 'sixteenth', 'seventeenth', 'eighteenth',
      'nineteenth', 'twentieth', 'twenty-first', 'twenty-second', 'twenty-third',
      'twenty-fourth', 'twenty-fifth', 'twenty-sixth', 'twenty-seventh',
      'twenty-eighth', 'twenty-ninth', 'thirtieth', 'thirty-first',
    ];
    const ONES = [
      '', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
      'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen',
      'seventeen', 'eighteen', 'nineteen',
    ];
    const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty'];
    function dayWord(n) {
      const d = parseInt(n, 10);
      return ORD_WORDS[d] || String(d);
    }
    function underSixty(n) {
      n = parseInt(n, 10);
      if (n < 20) return ONES[n];
      return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
    }
    function yearWords(y) {
      y = parseInt(y, 10);
      if (y >= 2010 && y <= 2099) return 'twenty ' + underSixty(y % 100);
      if (y >= 2000 && y <= 2009) return 'two thousand and ' + ONES[y % 100];
      return String(y);
    }
    function monthName(key) {
      return MONTHS[String(key).toLowerCase()] || key;
    }
    function speakDayMonth(day, monKey, year) {
      const core = 'the ' + dayWord(day) + ' of ' + monthName(monKey);
      return year ? core + ', ' + yearWords(year) : core;
    }
    const MON_RE = 'Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?';
    const DOW_RE = 'Mon(?:day)?|Tue(?:s(?:day)?)?|Wed(?:nesday)?|Thu(?:r(?:s(?:day)?)?)?|Fri(?:day)?|Sat(?:urday)?|Sun(?:day)?';

    // 13–27 Aug / 13-27 August (before dash→comma)
    s = s.replace(
      new RegExp('\\b(\\d{1,2})\\s*[–—-]\\s*(\\d{1,2})\\s+(' + MON_RE + ')\\b', 'gi'),
      function(_, d1, d2, mon) {
        return 'the ' + dayWord(d1) + ' to the ' + dayWord(d2) + ' of ' + monthName(mon);
      }
    );
    // 13 Aug–27 Aug
    s = s.replace(
      new RegExp('\\b(\\d{1,2})\\s+(' + MON_RE + ')\\s*[–—-]\\s*(\\d{1,2})\\s+(' + MON_RE + ')\\b', 'gi'),
      function(_, d1, m1, d2, m2) {
        return 'the ' + dayWord(d1) + ' of ' + monthName(m1) +
          ' to the ' + dayWord(d2) + ' of ' + monthName(m2);
      }
    );

    // Now safe to soften remaining dashes
    s = s.replace(/—|–/g, ', ');

    // 2026-07-17 → July the seventeenth, twenty twenty-six
    s = s.replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, function(_, y, m, d) {
      const mi = parseInt(m, 10) - 1;
      if (mi < 0 || mi > 11) return yearWords(y) + ' ' + m + ' ' + d;
      return MONTH_FULL[mi] + ' the ' + dayWord(d) + ', ' + yearWords(y);
    });
    // Fri 17 Jul / Friday, 17 July 2026
    s = s.replace(
      new RegExp('\\b(' + DOW_RE + ')[,\\s]+(\\d{1,2})(?:st|nd|rd|th)?\\s+(' + MON_RE + ')(?:\\s+(\\d{4}))?\\b', 'gi'),
      function(_, dow, day, mon, year) {
        const weekday = DOWS[dow.toLowerCase()] || DOWS[dow.toLowerCase().slice(0, 3)] || dow;
        return weekday + ' ' + speakDayMonth(day, mon, year);
      }
    );
    // Jul 17 / July 17th, 2026 (US order)
    s = s.replace(
      new RegExp('\\b(' + MON_RE + ')\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s*(\\d{4}))?\\b', 'gi'),
      function(match, mon, day, year) {
        const d = parseInt(day, 10);
        if (d < 1 || d > 31) return match;
        return speakDayMonth(day, mon, year);
      }
    );
    // 17 Jul / 17th July / 17 Jul 2026
    s = s.replace(
      new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(' + MON_RE + ')(?:\\s+(\\d{4}))?\\b', 'gi'),
      function(match, day, mon, year) {
        const d = parseInt(day, 10);
        if (d < 1 || d > 31) return match;
        return speakDayMonth(day, mon, year);
      }
    );
    // Bare weekday abbrev still left (e.g. "Mon:" lists)
    s = s.replace(/\b(Mon|Tue|Tues|Wed|Thu|Thur|Thurs|Fri|Sat|Sun)\b/g, function(m) {
      return DOWS[m.toLowerCase()] || m;
    });
    // Bare month abbrev still left ("Jul", "Sep.", chart labels) — never leave "Jul" for TTS
    s = s.replace(/\b(Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.?\b/gi, function(m) {
      return monthName(m.replace(/\.$/, ''));
    });
    // Standalone years that look like years in prose (after ISO handled)
    s = s.replace(/\b(20[2-9]\d)\b/g, function(_, y) { return yearWords(y); });
    // 07:30 / 7:30
    s = s.replace(/\b(\d{1,2}):(\d{2})\b/g, function(_, h, min) {
      const hour = parseInt(h, 10);
      if (min === '00') return String(hour) + " o'clock";
      if (min === '15') return 'quarter past ' + hour;
      if (min === '30') return 'half past ' + hour;
      if (min === '45') return 'quarter to ' + ((hour % 12) + 1);
      return hour + ' ' + min;
    });

    // Units
    s = s.replace(/\bW\/kg\b/gi, 'watts per kilo');
    s = s.replace(/\bg\/h\b/gi, 'grams per hour');
    s = s.replace(/\b%FTP\b/gi, 'percent of threshold');
    s = s.replace(/(\d+(?:\.\d+)?)\s*%\s*(?:of\s+)?FTP\b/gi, '$1 percent of threshold');
    s = s.replace(/(\d+(?:\.\d+)?)\s*w\/kg\b/gi, '$1 watts per kilo');
    s = s.replace(/(\d+)\s*min(?:ute)?s?\b/gi, '$1 minutes');
    s = s.replace(/(\d+)\s*hrs?\b/gi, function(_, n) {
      return n === '1' ? '1 hour' : n + ' hours';
    });
    s = s.replace(/(\d+)\s*bpm\b/gi, '$1 beats per minute');
    s = s.replace(/(\d+)\s*kcal\b/gi, '$1 calories');
    s = s.replace(/(\d+)\s*kJ\b/g, '$1 kilojoules');
    s = s.replace(/(\d+)\s*ms\b/gi, '$1 milliseconds');
    s = s.replace(/(\d+)\s*W\b/g, '$1 watts');
    s = s.replace(/(\d+)\s*kg\b/gi, '$1 kilos');

    s = s.replace(/\bZ([1-5])\b/g, 'zone $1');

    // Athlete-facing wording (not letter-by-letter spelling)
    const acronyms = [
      [/\bVO2\s*max\b/gi, 'V O 2 max'],
      [/\bVO₂max\b/gi, 'V O 2 max'],
      [/\bLTHR\b/g, 'lactate threshold heart rate'],
      [/\bACWR\b/g, 'acute to chronic ratio'],
      [/\bHRV\b/g, 'heart rate variability'],
      [/\bRHR\b/g, 'resting heart rate'],
      [/\bRPE\b/g, 'perceived effort'],
      [/\bTSS\b/g, 'training stress'],
      [/\bTSB\b/g, 'form'],
      [/\bCTL\b/g, 'fitness'],
      [/\bATL\b/g, 'fatigue'],
      [/\be?FTP\b/g, 'threshold power'],
      [/\bPMC\b/g, 'training load chart'],
      [/\bBTB\b/g, 'back to back'],
      [/\bNP\b/g, 'normalised power'],
    ];
    acronyms.forEach(function(pair) { s = s.replace(pair[0], pair[1]); });

    s = s.replace(/\s*\|\s*/g, ', ');
    s = s.replace(/\s{2,}/g, ' ');
    s = s.replace(/\n{2,}/g, '. ');
    s = s.replace(/\n/g, '. ');
    s = s.replace(/\.{2,}/g, '.');
    s = s.replace(/\s+([,.;:])/g, '$1');
    return s.trim();
  }

  function speakCoachReply(text) {
    // Legacy full-reply path — prefer feedTTS during streaming.
    resetTTSStream();
    feedTTS(text || '', true);
  }

  function resizeInput() {
    const input = document.getElementById('coach-input');
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  // Mic / STT — strict state machine + hold-to-talk (avoids click toggle races).
  // idle → starting → listening → stopping → idle
  let _micState = 'idle';
  let _micGen = 0;
  let _pendingStop = false;
  let _finalTranscript = '';

  function setMicState(next) {
    _micState = next;
    syncMicUI();
  }

  function syncMicUI() {
    if (!micBtn || micBtn.style.display === 'none') return;
    const sendBusy = document.getElementById('send-btn').disabled;
    const trans = _micState === 'starting' || _micState === 'stopping';
    micBtn.disabled = trans || sendBusy;
    micBtn.style.opacity = (trans || sendBusy) ? '0.55' : '1';
    micBtn.style.cursor = micBtn.disabled ? 'default' : 'pointer';

    if (_micState === 'listening' || _micState === 'starting') {
      micBtn.style.borderColor = 'rgba(99,102,241,0.7)';
      micBtn.style.color = 'var(--accent)';
      micBtn.style.background = 'rgba(99,102,241,0.12)';
      micBtn.textContent = 'HOLD';
      micBtn.title = 'Release to send';
      if (_micState === 'starting') setVoiceStatus('Starting mic… hold to talk');
      else setVoiceStatus('Listening… release to send');
    } else if (_micState === 'stopping') {
      micBtn.style.borderColor = 'rgba(99,102,241,0.7)';
      micBtn.style.color = 'var(--accent)';
      micBtn.style.background = 'rgba(99,102,241,0.12)';
      micBtn.textContent = '…';
      micBtn.title = 'Stopping…';
      setVoiceStatus('Stopping…');
    } else {
      micBtn.style.borderColor = 'var(--border)';
      micBtn.style.color = 'var(--muted)';
      micBtn.style.background = 'none';
      micBtn.textContent = 'MIC';
      micBtn.title = 'Hold to talk';
      const vs = voiceStatus.textContent || '';
      if (/Listening|Starting mic|Stopping|hold to talk|release to send/i.test(vs)) {
        setVoiceStatus('');
      }
    }
  }

  function detachRecognition(r) {
    if (!r) return;
    r.onstart = null;
    r.onresult = null;
    r.onerror = null;
    r.onend = null;
  }

  function abortRecognitionSilent() {
    if (!_recognition) return;
    const r = _recognition;
    detachRecognition(r);
    try { r.abort(); } catch (e) {}
    _recognition = null;
  }

  function finishMicSession(gen, wasAuto) {
    if (gen !== _micGen) return;
    _pendingStop = false;
    _recognition = null;
    setMicState('idle');
    const input = document.getElementById('coach-input');
    const text = (input.value || '').trim();
    if (wasAuto && text && text !== _voiceBaseText) {
      setTimeout(function() {
        if (gen !== _micGen) return;
        if (!document.getElementById('send-btn').disabled) sendCoachMessage();
      }, 200);
    } else if (!(voiceStatus.textContent || '').match(/blocked|No mic|network|hiccup|No speech/)) {
      setVoiceStatus('');
    }
  }

  function makeRecognition(gen) {
    const r = new SpeechRecognition();
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.lang = navigator.language || 'en-GB';

    r.onstart = function() {
      if (gen !== _micGen) return;
      if (_pendingStop) {
        // Released before Chrome finished starting — stop immediately
        _pendingStop = false;
        setMicState('stopping');
        try { r.stop(); } catch (e) { try { r.abort(); } catch (e2) {} }
        return;
      }
      setMicState('listening');
    };

    r.onresult = function(event) {
      if (gen !== _micGen) return;
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) _finalTranscript += t;
        else interim += t;
      }
      const input = document.getElementById('coach-input');
      const spoken = (_finalTranscript + (interim ? ' ' + interim : '')).trim();
      const pieces = [_voiceBaseText, spoken].filter(Boolean);
      input.value = pieces.join(pieces.length === 2 ? ' ' : '');
      resizeInput();
    };

    r.onerror = function(event) {
      if (gen !== _micGen) return;
      const err = event.error || '';
      if (err === 'aborted') return; // onend follows
      if (err === 'not-allowed' || err === 'service-not-allowed') {
        setVoiceStatus('Microphone blocked — allow access for this site, or type instead');
        return;
      }
      if (err === 'no-speech') {
        setVoiceStatus('No speech heard — hold MIC and try again');
        return;
      }
      if (err === 'audio-capture') {
        setVoiceStatus('No microphone found');
        return;
      }
      if (err === 'network') {
        setVoiceStatus('Speech service network error — try again');
        return;
      }
      setVoiceStatus('Mic hiccup — hold MIC again');
    };

    r.onend = function() {
      if (gen !== _micGen) return;
      const wasAuto = _autoSendOnStop;
      _autoSendOnStop = false;
      finishMicSession(gen, wasAuto);
    };

    return r;
  }

  function stopListening(opts) {
    opts = opts || {};
    if (_micState === 'idle' || _micState === 'stopping') return;

    _autoSendOnStop = !!opts.autoSend;

    if (_micState === 'starting') {
      // Don't abort mid-start (races Chrome) — stop as soon as onstart fires
      _pendingStop = true;
      return;
    }

    // listening
    setMicState('stopping');
    if (!_recognition) {
      finishMicSession(_micGen, _autoSendOnStop);
      return;
    }
    try {
      _recognition.stop();
    } catch (e) {
      try { _recognition.abort(); } catch (e2) {}
      finishMicSession(_micGen, _autoSendOnStop);
    }
  }

  function startListening() {
    if (!SpeechRecognition) return;
    if (_micState !== 'idle') return;
    const sendBtn = document.getElementById('send-btn');
    if (sendBtn.disabled) {
      setVoiceStatus('Wait for the coach to finish…');
      return;
    }

    stopTTS();
    const input = document.getElementById('coach-input');
    _voiceBaseText = input.value.trim();
    _finalTranscript = '';
    _autoSendOnStop = true;
    _pendingStop = false;
    _micGen += 1;
    const gen = _micGen;

    abortRecognitionSilent();
    setMicState('starting');
    _recognition = makeRecognition(gen);

    try {
      _recognition.start();
    } catch (e) {
      // Prior session still tearing down — one delayed retry, same generation
      abortRecognitionSilent();
      setTimeout(function() {
        if (gen !== _micGen || _micState !== 'starting') return;
        _recognition = makeRecognition(gen);
        try {
          _recognition.start();
        } catch (e2) {
          setVoiceStatus('Could not start mic — try again');
          finishMicSession(gen, false);
        }
      }, 300);
    }
  }

  if (SpeechRecognition) {
    micBtn.style.display = '';
    // Hold-to-talk: press/hold starts, release stops + sends. No click toggle races.
    micBtn.addEventListener('pointerdown', function(e) {
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      try { micBtn.setPointerCapture(e.pointerId); } catch (err) {}
      startListening();
    });
    function endHold(e) {
      e.preventDefault();
      stopListening({autoSend: true});
    }
    micBtn.addEventListener('pointerup', endHold);
    micBtn.addEventListener('pointercancel', endHold);
    micBtn.addEventListener('lostpointercapture', function() {
      if (_micState === 'listening' || _micState === 'starting') {
        stopListening({autoSend: true});
      }
    });
    // Keyboard: Space toggles for accessibility (hold not practical from keydown alone)
    micBtn.addEventListener('keydown', function(e) {
      if (e.key !== ' ' && e.key !== 'Enter') return;
      e.preventDefault();
      if (_micState === 'idle') startListening();
      else if (_micState === 'listening') stopListening({autoSend: true});
    });
  }

  if (_ttsSupported) {
    muteBtn.style.display = '';
    syncMuteUI();
  }
  if (muteBtn) {
    muteBtn.addEventListener('click', function(e) {
      e.preventDefault();
      _ttsMuted = !_ttsMuted;
      localStorage.setItem('coach_tts_muted', _ttsMuted ? '1' : '0');
      if (_ttsMuted) stopTTS();
      syncMuteUI();
    });
  }

  function mdToHtml(text) {
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong style="color:var(--text);font-weight:500">$1</strong>');
  }

  function updateBubble(bubble, text, streaming) {
    const paras = text.trim().split(/\n\n+/);
    bubble.innerHTML = '';
    paras.forEach((para, i) => {
      if (!para.trim()) return;
      const p = document.createElement('p');
      if (i > 0) p.style.marginTop = '8px';
      const isLast = i === paras.length - 1;
      p.innerHTML = mdToHtml(para.trim()) + (streaming && isLast ? '<span style="color:var(--muted)"> ▋</span>' : '');
      bubble.appendChild(p);
    });
  }

  function renderMessage(role, text) {
    const empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    const wrap = document.createElement('div');
    wrap.style.cssText = role === 'user' ? 'display:flex;justify-content:flex-end' : 'display:flex;justify-content:flex-start';
    const bubble = document.createElement('div');
    if (role === 'user') {
      bubble.style.cssText = 'max-width:72%;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.2);padding:10px 14px;border-radius:2px;font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap';
      bubble.textContent = text;
    } else {
      bubble.style.cssText = 'max-width:85%;background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--accent);padding:10px 14px;border-radius:2px;font-size:13px;color:var(--text-dim);line-height:1.75';
      updateBubble(bubble, text, false);
    }
    wrap.appendChild(bubble);
    document.getElementById('chat-messages').appendChild(wrap);
    document.getElementById('chat-messages').scrollTop = 99999;
    return bubble;
  }

  function _hideProposalsIfEmpty() {
    const container = document.getElementById('proposal-cards');
    if (!_proposals.length) {
      container.style.display = 'none';
      container.innerHTML = '';
    }
  }

  function renderProposals(proposals) {
    _proposals = proposals.filter(p => p && p.session_type);
    const container = document.getElementById('proposal-cards');
    container.innerHTML = '';
    if (!_proposals.length) {
      container.style.display = 'none';
      return;
    }
    _proposals.forEach((proposal) => {
      const card = window.PlanChange.render(container, proposal, {showDismiss: true});
      card.style.marginBottom = '0';
      card.addEventListener('planchange:applied', (e) => {
        _proposals = _proposals.filter(p => p.date !== proposal.date);
        const data = e.detail.data || {};
        const g = data.garmin || {};
        const sync = g.pushed
          ? ' Pushed to Garmin Connect.'
          : ' Saved locally — Garmin sync failed.';
        const durText = data.duration_min ? `**${data.duration_min} min**` : '**rest day**';
        renderMessage('assistant', `✓ Applied: **${data.label}** on ${data.date} updated to ${durText}.${sync}`);
        // Drop the synced card so any remaining proposal stays reachable
        setTimeout(() => {
          if (card.parentNode) card.remove();
          _hideProposalsIfEmpty();
        }, 900);
      });
      card.addEventListener('planchange:dismissed', () => {
        _proposals = _proposals.filter(p => p.date !== proposal.date);
        _hideProposalsIfEmpty();
      });
    });
    container.style.display = 'flex';
    container.scrollTop = 0;
  }

  window.dismissProposal = function(idx) {
    if (typeof idx === 'number') {
      _proposals.splice(idx, 1);
      renderProposals(_proposals);
      return;
    }
    _proposals = [];
    const container = document.getElementById('proposal-cards');
    container.style.display = 'none';
    container.innerHTML = '';
  };

  window.sendCoachMessage = async function() {
    const input = document.getElementById('coach-input');
    const btn = document.getElementById('send-btn');
    const text = input.value.trim();
    if (!text || btn.disabled) return;

    if (_micState !== 'idle') stopListening({autoSend: false});
    resetTTSStream();

    input.value = '';
    input.style.height = 'auto';
    btn.disabled = true;
    btn.textContent = '…';
    if (micBtn) micBtn.disabled = true;
    dismissProposal();
    renderMessage('user', text);

    // Create streaming bubble immediately
    const empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;justify-content:flex-start';
    const bubble = document.createElement('div');
    bubble.style.cssText = 'max-width:85%;background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--accent);padding:10px 14px;border-radius:2px;font-size:13px;color:var(--text-dim);line-height:1.75';
    bubble.innerHTML = '<span style="color:var(--muted)">▋</span>';
    wrap.appendChild(bubble);
    document.getElementById('chat-messages').appendChild(wrap);
    document.getElementById('chat-messages').scrollTop = 99999;

    let accumulated = '';
    let streamDone = false;

    try {
      const res = await fetch('/coach-chat-stream', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text}),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});

        const parts = buffer.split('\n\n');
        buffer = parts.pop();

        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          try {
            const event = JSON.parse(part.slice(6));
            if (event.type === 'text') {
              accumulated += event.chunk;
              updateBubble(bubble, accumulated, true);
              document.getElementById('chat-messages').scrollTop = 99999;
              feedTTS(accumulated, false);
            } else if (event.type === 'tool') {
              if (!accumulated) {
                const labels = {
                  get_meal_cycle: 'the meal plan', get_activity_analysis: 'your session analysis',
                  get_sleep_history: 'your sleep history', get_performance_detail: 'your performance data',
                  get_hr_plan: 'the Haute Route plan', get_compliance_detail: 'your plan compliance',
                  get_workout_description: 'the workout details', get_fuelling_plan: 'your fuelling plan',
                  get_event_plans: 'your event plans',
                };
                bubble.innerHTML = '<span style="color:var(--muted)">🔍 checking ' +
                  (labels[event.name] || 'your data') + '…</span>';
                if (!_ttsFillerSaid) {
                  _ttsFillerSaid = true;
                  enqueueSpeech('One moment, checking your data.');
                }
              }
            } else if (event.type === 'proposal' && event.data && event.data.session_type) {
              const existing = _proposals.some(p => p.date === event.data.date);
              if (!existing) _proposals.push(event.data);
              renderProposals(_proposals);
            } else if (event.type === 'done') {
              if (accumulated) updateBubble(bubble, accumulated, false);
              streamDone = true;
              feedTTS(accumulated, true);
            } else if (event.type === 'error') {
              bubble.textContent = '';
              const p = document.createElement('p');
              p.style.color = 'var(--muted)';
              p.textContent = event.message || 'Something went wrong. Please try again.';
              bubble.appendChild(p);
              stopTTS();
            }
          } catch(e) {}
        }
      }
      if (!streamDone && accumulated) feedTTS(accumulated, true);
    } catch(e) {
      bubble.innerHTML = '<p style="color:var(--muted)">Connection error. Please try again.</p>';
      stopTTS();
    } finally {
      btn.disabled = false;
      btn.textContent = 'SEND';
      if (micBtn) micBtn.disabled = false;
      input.focus();
    }
  };

  window.clearChatHistory = async function() {
    if (!confirm('Clear the conversation history?')) return;
    stopListening({autoSend: false});
    stopTTS();
    await fetch('/coach-history', {method: 'DELETE'});
    document.getElementById('chat-messages').innerHTML = '<p id="chat-empty" style="font-family:var(--font-m);font-size:12px;color:var(--muted);text-align:center;padding:32px 0">Ask your coach anything about your training...</p>';
    dismissProposal();
    setVoiceStatus('');
  };

  async function loadHistory() {
    try {
      const res = await fetch('/coach-history');
      const history = await res.json();
      history.forEach(m => renderMessage(m.role, m.content));
      if (history.length) document.getElementById('chat-messages').scrollTop = 99999;
      // Re-show the latest pending proposal card(s) so a refresh doesn't lose them
      for (let i = history.length - 1; i >= 0; i--) {
        const m = history[i];
        if (m.role !== 'assistant' || !m.proposal) continue;
        try {
          const raw = typeof m.proposal === 'string' ? JSON.parse(m.proposal) : m.proposal;
          const props = Array.isArray(raw) ? raw : (raw ? [raw] : []);
          if (props.length) renderProposals(props);
        } catch (e) {}
        break;
      }
    } catch(e) {}
  }

  loadHistory();
})();
</script>
