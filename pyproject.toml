[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-endurance-coach-over50"
version = "0.1.0"
description = "AI endurance coaching dashboard for the 50+ athlete, powered by Garmin Connect data and Claude AI"
requires-python = ">=3.10"
dependencies = [
    "garminconnect==0.3.17",  # pin the version this tree is developed against; 0.3.6+ added get_scheduled_workouts/unschedule_workout
    "rich>=13.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "anthropic>=1.4,<2",  # 1.0 removed temperature/top_p/top_k from messages.* (no **kwargs); stay on 1.x
    "markdown>=3.5",
    "fitdecode>=0.10",
    "python-multipart>=0.0.9",  # FastAPI UploadFile for POST /upload-fit
    "bleach>=6.1",  # sanitise markdown HTML before it is marked safe
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
endurance-coach = "ai_endurance_coach_over50.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["archive"]

[tool.hatch.build.targets.sdist]
# Research scratch (TCX caches, one-off analyses). Not part of the app.
exclude = ["/archive"]

[tool.hatch.build.targets.wheel]
packages = ["ai_endurance_coach_over50"]

[tool.hatch.build.targets.wheel.force-include]
"architecture.html" = "ai_endurance_coach_over50/architecture.html"
"docs" = "ai_endurance_coach_over50/help_docs"
